x-app-environment: &app-environment
  DARSM_ENVIRONMENT: beta
  DARSM_RELEASE: ${DARSM_RELEASE:-beta}
  DARSM_LOG_LEVEL: ${DARSM_LOG_LEVEL:-INFO}
  DARSM_DATABASE_HOST: postgres
  DARSM_DATABASE_PORT: 5432
  DARSM_DATABASE_NAME: ${POSTGRES_DB:-dars_manager}
  DARSM_DATABASE_USER: ${POSTGRES_USER:-dars_manager}
  DARSM_DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
  DARSM_REDIS_URL: redis://redis:6379/0
  DARSM_COOKIE_SECURE: "true"
  DARSM_SESSION_COOKIE: ${DARSM_SESSION_COOKIE:-__Host-dars_session}
  DARSM_FRONTEND_ORIGIN: https://${DARSM_DOMAIN}
  DARSM_TRUSTED_ORIGINS: https://${DARSM_DOMAIN}
  DARSM_ALLOWED_HOSTS: ${DARSM_DOMAIN},api,127.0.0.1
  DARSM_WHISPER_CPU_THREADS: ${DARSM_WHISPER_CPU_THREADS:-4}
  DARSM_TRANSCRIPTION_BACKEND: ${DARSM_TRANSCRIPTION_BACKEND:-openai}
  DARSM_TRANSCRIPTION_MODEL: ${DARSM_TRANSCRIPTION_MODEL:-whisper-1}
  DARSM_TRANSCRIPTION_CHUNK_SECONDS: ${DARSM_TRANSCRIPTION_CHUNK_SECONDS:-540}
  DARSM_TRANSCRIPTION_CHUNK_MAX_BYTES: ${DARSM_TRANSCRIPTION_CHUNK_MAX_BYTES:-24000000}
  DARSM_JOB_TTL_SECONDS: ${DARSM_JOB_TTL_SECONDS:-7200}
  DARSM_MAX_UPLOAD_BYTES: ${DARSM_MAX_UPLOAD_BYTES:-524288000}
  DARSM_MEDIA_BACKEND: ${DARSM_MEDIA_BACKEND:-local}
  DARSM_MEDIA_ROOT: ${DARSM_MEDIA_ROOT:-/workspaces/media}
  DARSM_MEDIA_RETENTION_SECONDS: ${DARSM_MEDIA_RETENTION_SECONDS:-604800}
  DARSM_MEDIA_UPLOAD_URL_TTL_SECONDS: ${DARSM_MEDIA_UPLOAD_URL_TTL_SECONDS:-900}
  DARSM_EXECUTION_BACKEND: worker
  DARSM_WORKER_POLL_SECONDS: ${DARSM_WORKER_POLL_SECONDS:-2}
  DARSM_WORKER_LEASE_SECONDS: ${DARSM_WORKER_LEASE_SECONDS:-120}
  DARSM_WORKER_MAX_ATTEMPTS: ${DARSM_WORKER_MAX_ATTEMPTS:-3}
  DARSM_MAINTENANCE_INTERVAL_SECONDS: ${DARSM_MAINTENANCE_INTERVAL_SECONDS:-3600}
  DARSM_STORAGE_PROVIDER: ${DARSM_STORAGE_PROVIDER:-local}
  DARSM_STORAGE_MODEL: ${DARSM_STORAGE_MODEL:-temporary-standard}
  DARSM_STORAGE_GB_MONTH_USD: ${DARSM_STORAGE_GB_MONTH_USD:-0}
  DARSM_STORAGE_PRICE_SOURCE_URL: ${DARSM_STORAGE_PRICE_SOURCE_URL:-}
  DARSM_S3_BUCKET: ${DARSM_S3_BUCKET:-}
  DARSM_S3_REGION: ${DARSM_S3_REGION:-eu-west-3}
  DARSM_S3_ENDPOINT_URL: ${DARSM_S3_ENDPOINT_URL:-}
  DARSM_SMTP_HOST: ${DARSM_SMTP_HOST:-}
  DARSM_SMTP_PORT: ${DARSM_SMTP_PORT:-587}
  DARSM_SMTP_USERNAME: ${DARSM_SMTP_USERNAME:-}
  DARSM_SMTP_STARTTLS: ${DARSM_SMTP_STARTTLS:-true}
  DARSM_SMTP_SSL: ${DARSM_SMTP_SSL:-false}
  DARSM_EMAIL_FROM: ${DARSM_EMAIL_FROM:-}
  DARSM_INVITATION_TTL_SECONDS: ${DARSM_INVITATION_TTL_SECONDS:-172800}

x-app-security: &app-security
  init: true
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:size=256m,mode=1777
    - /workspaces:size=4g,mode=0700,uid=10001,gid=10001

services:
  gateway:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    environment:
      DARSM_DOMAIN: ${DARSM_DOMAIN}
    ports:
      - "${DARSM_HTTP_PORT:-80}:80"
      - "${DARSM_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  api:
    <<: *app-security
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      <<: *app-environment
      DARSM_SMTP_PASSWORD_FILE: /run/secrets/smtp_password
    expose:
      - "8000"
    command:
      - python
      - -m
      - uvicorn
      - backend.app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips=*
    secrets:
      - postgres_password
      - smtp_password
    volumes:
      - model-cache:/models
      - media-data:/workspaces/media
    networks:
      - edge
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    <<: *app-security
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "backend.worker"]
    environment:
      <<: *app-environment
      DARSM_OPENAI_TIMEOUT_SECONDS: ${DARSM_OPENAI_TIMEOUT_SECONDS:-900}
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
    secrets:
      - postgres_password
      - openai_api_key
    volumes:
      - model-cache:/models
      - media-data:/workspaces/media
    networks:
      - backend
      - egress
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  maintenance:
    <<: *app-security
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "backend.maintenance"]
    environment:
      <<: *app-environment
    secrets:
      - postgres_password
    volumes:
      - media-data:/workspaces/media
    networks:
      - backend
      - egress
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dars_manager}
      POSTGRES_USER: ${POSTGRES_USER:-dars_manager}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - backend
    read_only: true
    tmpfs:
      - /data:size=64m,mode=0700
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

networks:
  edge:
  egress:
  backend:
    internal: true

secrets:
  postgres_password:
    file: ${DARSM_POSTGRES_PASSWORD_FILE:-./secrets/postgres_password}
  openai_api_key:
    file: ${DARSM_OPENAI_API_KEY_FILE:-./secrets/openai_api_key}
  smtp_password:
    file: ${DARSM_SMTP_PASSWORD_FILE:-./secrets/smtp_password}

volumes:
  postgres-data:
  model-cache:
  media-data:
  caddy-data:
  caddy-config:
